services:
  postgres:
    image: postgres:16-alpine
    container_name: soclite-postgres
    environment:
      POSTGRES_USER: soclite
      POSTGRES_PASSWORD: soclite
      POSTGRES_DB: soclite
    ports:
      - "5432:5432"
    volumes:
      - soclite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soclite -d soclite"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: soclite-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://soclite:soclite@postgres:5432/soclite
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-soclite-webhook-token}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      ENRICHMENT_MOCK: ${ENRICHMENT_MOCK:-true}
      TRIAGE_FALLBACK_ENABLED: "true"
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  ollama:
    image: ollama/ollama:latest
    container_name: soclite-ollama
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - soclite_ollama:/root/.ollama

  n8n:
    image: n8nio/n8n:2.45.5
    container_name: soclite-n8n
    profiles: ["n8n"]
    depends_on:
      - api
    environment:
      # Sin mapeo de puertos al host: Dokploy publica 5678 via Traefik (Domains).
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}
      N8N_PROXY_HOPS: "1"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: "America/Lima"
      TZ: "America/Lima"
      # Variables consumidas por el workflow (n8n/workflows/soc_lite_triage.json)
      SOC_API_URL: http://api:8000
      SOC_WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-soclite-webhook-token}
      SOC_API_USER: ${N8N_SERVICE_USER:-n8n}
      SOC_API_PASSWORD: ${N8N_SERVICE_PASSWORD:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-#soc-alertas}
      OSTICKET_URL: ${OSTICKET_URL:-http://osticket/api/tickets.json}
      OSTICKET_API_KEY: ${OSTICKET_API_KEY:-}
    volumes:
      - soclite_n8n:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

  frontend:
    build: ./frontend
    container_name: soclite-frontend
    depends_on:
      - api
    ports:
      - "5173:80"
    profiles: ["frontend"]

volumes:
  soclite_pgdata:
  soclite_ollama:
  soclite_n8n:
