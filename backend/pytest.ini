[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
addopts = -m "unit"
markers =
    unit: pruebas sin servicios externos (sin PostgreSQL ni red)
    integration: pruebas de integración; requieren PostgreSQL en localhost:5432
filterwarnings =
    ignore::DeprecationWarning
